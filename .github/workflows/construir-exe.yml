name: Construir ejecutable portable (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas automáticas
        run: python -m unittest -v
      - name: Empaquetar con PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name VisualizadorEncuestas --paths app --distpath dist/VisualizadorEncuestas app/main.py
      - name: Copiar LEEME y ejemplo
        run: |
          copy LEEME.txt dist\VisualizadorEncuestas\LEEME.txt
          copy ejemplos\encuesta_ejemplo.csv dist\VisualizadorEncuestas\encuesta_ejemplo.csv
      - uses: actions/upload-artifact@v4
        with:
          name: VisualizadorEncuestas_portable
          path: dist/VisualizadorEncuestas
